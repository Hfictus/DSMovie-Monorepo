[build]
  # Caminho para a pasta onde o front-end está localizado no monorepo
  base = "frontend/"

  # Comando de build para React + Vite 7 + Yarn 4 (Modern)
  command = "yarn build"

  # Como o Netlify já está dentro de "frontend/", o publish é apenas "dist/"
  publish = "dist/"

[build.environment]
  # Define a versão do Node compatível com o seu ambiente local (Node 24)
  NODE_VERSION = "24.7.0"
  
  # Garante suporte adequado às definições do Yarn 4 Modern no ecossistema Netlify
  YARN_VERSION = "4.9.4"